name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version line: ${VERSION_OUTPUT}"
          MAJOR_VERSION=$(echo "${VERSION_OUTPUT}" | sed -nE 's/.*version "([0-9]+)(\.([0-9]+))?.*".*/\1/p')
          if [ -z "${MAJOR_VERSION}" ]; then
            echo "::error::Unable to detect the active Java major version."
            exit 1
          fi
          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Active Java major version (${MAJOR_VERSION}) is lower than the required Java 17."
            exit 1
          fi
          echo "Confirmed active Java major version is ${MAJOR_VERSION} (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "${KEYSTORE_FILE}" ]; then
            echo "Existing ./debug.keystore detected; skipping generation."
          else
            echo "Generating temporary ./debug.keystore using Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "${KEYSTORE_FILE}" ] || [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "::error::Failed to create or verify ./debug.keystore."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            echo "Searching inside app/build/outputs/apk for diagnostic visibility:"
            if [ -d "app/build/outputs/apk" ]; then
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::Selected file does not have the .apk extension."
              exit 1
              ;;
          esac
          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Unexpected APK path: ${EXPECTED_APK}"
            exit 1
          fi
          APK_BYTES=$(wc -c < "${EXPECTED_APK}")
          echo "Verified debug APK at ${EXPECTED_APK} (${APK_BYTES} bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK is missing or empty before asset preparation."
            exit 1
          fi
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${TEMP_ASSET_DIR}"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"
          cp "${SOURCE_APK}" "${ASSET_PATH}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to copy prepared APK release asset to ${ASSET_PATH}."
            exit 1
          fi
          echo "Prepared release asset: ${ASSET_FILENAME}"
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh --version; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::warning::Prepared APK release asset does not exist or is empty: ${ASSET_PATH}"
            exit 1
          fi
          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not have a .apk extension: ${ASSET_PATH}"
              exit 1
              ;;
          esac
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          cat <<EOF > "${NOTES_FILE}"
          ### Automated Debug APK Build

          - **Artifact Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** \`${GITHUB_RUN_NUMBER}\`
          - **Workflow Run Attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Intended Use:** Testing and verification only (not a Google Play Store production release)
          - **Signing Configuration:** Signed only with a temporary debug keystore generated during the CI run

          #### Direct Phone Download
          Download **\`${ASSET_NAME}\`** directly from the **Assets** section of this GitHub Release.
          EOF

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${RELEASE_OUTCOME}" = "success" ] && gh release view "${RELEASE_TAG}" --json url,tagName,name,assets > "${RUNNER_TEMP}/release-view.json" 2>/dev/null; then
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq '.url')
            echo "GitHub Release published successfully."
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Build Status:** Succeeded"
              echo "- **Release Status:** Published (Latest)"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Direct GitHub Release URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "You can download **\`${ASSET_NAME}\`** directly on your phone from the **Assets** section of the [GitHub Release page](${RELEASE_URL})."
              echo ""
              echo "The normal GitHub Actions artifact named **\`app-debug-apk\`** is also available on this workflow run summary page as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing did not complete. However, the debug APK build succeeded and the Actions artifact named 'app-debug-apk' remains available for download."
            echo "APK Build Status: Succeeded"
            echo "Backup Actions Artifact Name: app-debug-apk"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "> [!WARNING]"
              echo "> GitHub Release publishing failed or was skipped, but **the debug APK build and artifact upload succeeded**."
              echo ""
              echo "- **Build Status:** Succeeded"
              echo "- **Actions Artifact Name:** \`app-debug-apk\`"
              echo "- **Verified APK Path:** \`app/build/outputs/apk/debug/app-debug.apk\`"
              echo ""
              echo "### How to Download the APK"
              echo "Open the **Artifacts** section of this GitHub Actions workflow run and download **\`app-debug-apk\`**."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
